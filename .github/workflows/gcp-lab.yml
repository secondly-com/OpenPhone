name: GCP Lab

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to test. Defaults to this workflow SHA."
        required: false
        default: ""
      repo_url:
        description: "Git repo URL to clone on the lab VM"
        required: true
        default: "https://github.com/secondly-com/OpenPhone.git"
      pr_number:
        description: "Optional PR number for labels/naming"
        required: false
        default: ""
      runtime:
        description: "Comma-separated runtime intents"
        required: true
        default: "local"
      lane:
        description: "Lab lane"
        required: true
        default: "incremental-emulator"
        type: choice
        options:
          - incremental-emulator
          - smoke-only
          - export-emulator-image
          - assistant-apk
          - custom
      arch:
        description: "Emulator architecture"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - arm64
      machine_type:
        description: "GCP machine type"
        required: true
        default: "c3-standard-22"
      boot_disk_size:
        description: "GCP boot disk size"
        required: true
        default: "1000GB"
      boot_disk_type:
        description: "GCP boot disk type"
        required: true
        default: "pd-ssd"
      cache_mode:
        description: "Android tree/cache strategy"
        required: true
        default: "scratch"
        type: choice
        options:
          - scratch
          - attach-disk
          - snapshot
      cache_disk:
        description: "Existing cache disk name for attach-disk, or per-run disk name for snapshot"
        required: false
        default: ""
      cache_source_snapshot:
        description: "Warm cache snapshot name when cache_mode=snapshot"
        required: false
        default: ""
      keep_vm:
        description: "Leave the lab VM running for debugging"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      export_emulator_image:
        description: "Custom lane only: upload sdk-repo-linux-system-images.zip"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_smoke:
        description: "Custom lane only: boot emulator and run smoke after build/export"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      skip_build:
        description: "Custom lane only: reuse existing build outputs from a warm cache image"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  pull_request_target:
    types:
      - labeled

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: gcp-lab-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  gcp-emulator-lab:
    name: GCP emulator lab
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'run-gcp-lab'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      OPENPHONE_GCP_PROJECT: ${{ vars.OPENPHONE_GCP_PROJECT || 'openphone-lab' }}
      OPENPHONE_GCP_REGION: ${{ vars.OPENPHONE_GCP_REGION || 'us-central1' }}
      OPENPHONE_GCP_ZONE: ${{ vars.OPENPHONE_GCP_ZONE || 'us-central1-a' }}
      OPENPHONE_GCP_MACHINE_TYPE: ${{ vars.OPENPHONE_GCP_MACHINE_TYPE || 'c3-standard-22' }}
      OPENPHONE_GCP_BOOT_DISK_SIZE: ${{ vars.OPENPHONE_GCP_BOOT_DISK_SIZE || '1000GB' }}
      OPENPHONE_GCP_BOOT_DISK_TYPE: ${{ vars.OPENPHONE_GCP_BOOT_DISK_TYPE || 'pd-ssd' }}
      OPENPHONE_GCP_CACHE_SOURCE_SNAPSHOT: ${{ vars.OPENPHONE_GCP_CACHE_SOURCE_SNAPSHOT || '' }}
    steps:
      - name: Check out trusted workflow repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate repository scaffold
        run: |
          set -euxo pipefail
          ./scripts/check.sh
          git diff --check

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.OPENPHONE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.OPENPHONE_GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Select target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            pr_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
            ref="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            repo_url="$(jq -r '.pull_request.head.repo.clone_url' "$GITHUB_EVENT_PATH")"
            name="openphone-lab-pr-${pr_number}-${{ github.run_id }}-${{ github.run_attempt }}"
            runtime="local"
            arch="${{ vars.OPENPHONE_EMULATOR_ARCH || 'x86_64' }}"
            machine_type="${OPENPHONE_GCP_MACHINE_TYPE}"
            boot_disk_size="${OPENPHONE_GCP_BOOT_DISK_SIZE}"
            boot_disk_type="${OPENPHONE_GCP_BOOT_DISK_TYPE}"
            cache_source_snapshot="$(
              scripts/lab/gcp/latest-cache-snapshot.sh \
                --project "${OPENPHONE_GCP_PROJECT}" \
                --arch "$arch" || true
            )"
            if [[ -z "$cache_source_snapshot" ]]; then
              cache_source_snapshot="${OPENPHONE_GCP_CACHE_SOURCE_SNAPSHOT}"
            fi
            if [[ -n "$cache_source_snapshot" ]]; then
              cache_mode="snapshot"
            else
              cache_mode="scratch"
            fi
            cache_disk=""
            keep_vm="false"
            lane="incremental-emulator"
            export_emulator_image="false"
            build_assistant_apk="false"
            run_smoke="true"
            skip_build="false"
          else
            pr_number="${{ inputs.pr_number }}"
            ref="${{ inputs.ref }}"
            if [[ -z "$ref" ]]; then
              ref="${GITHUB_SHA}"
            fi
            repo_url="${{ inputs.repo_url }}"
            if [[ -z "$repo_url" ]]; then
              repo_url="https://github.com/secondly-com/OpenPhone.git"
            fi
            name="openphone-lab-manual-${pr_number:-${{ github.run_id }}}-${{ github.run_attempt }}"
            runtime="${{ inputs.runtime }}"
            arch="${{ inputs.arch }}"
            machine_type="${{ inputs.machine_type }}"
            boot_disk_size="${{ inputs.boot_disk_size }}"
            boot_disk_type="${{ inputs.boot_disk_type }}"
            cache_mode="${{ inputs.cache_mode }}"
            cache_disk="${{ inputs.cache_disk }}"
            cache_source_snapshot="${{ inputs.cache_source_snapshot }}"
            if [[ -z "$cache_source_snapshot" ]]; then
              cache_source_snapshot="$(
                scripts/lab/gcp/latest-cache-snapshot.sh \
                  --project "${OPENPHONE_GCP_PROJECT}" \
                  --arch "$arch" || true
              )"
            fi
            keep_vm="${{ inputs.keep_vm }}"
            lane="${{ inputs.lane }}"
            case "$lane" in
              incremental-emulator)
                export_emulator_image="false"
                build_assistant_apk="false"
                run_smoke="true"
                skip_build="false"
                ;;
              smoke-only)
                export_emulator_image="false"
                build_assistant_apk="false"
                run_smoke="true"
                skip_build="true"
                ;;
              export-emulator-image)
                export_emulator_image="true"
                build_assistant_apk="false"
                run_smoke="false"
                skip_build="false"
                ;;
              assistant-apk)
                export_emulator_image="false"
                build_assistant_apk="true"
                run_smoke="false"
                skip_build="false"
                ;;
              custom)
                export_emulator_image="${{ inputs.export_emulator_image }}"
                build_assistant_apk="false"
                run_smoke="${{ inputs.run_smoke }}"
                skip_build="${{ inputs.skip_build }}"
                ;;
              *)
                echo "::error::Unsupported GCP lab lane: $lane"
                exit 1
                ;;
            esac
          fi

          {
            echo "name=$name"
            echo "ref=$ref"
            echo "repo_url=$repo_url"
            echo "runtime=$runtime"
            echo "lane=$lane"
            echo "arch=$arch"
            echo "machine_type=$machine_type"
            echo "boot_disk_size=$boot_disk_size"
            echo "boot_disk_type=$boot_disk_type"
            echo "cache_mode=$cache_mode"
            echo "cache_disk=$cache_disk"
            echo "cache_source_snapshot=$cache_source_snapshot"
            echo "keep_vm=$keep_vm"
            echo "export_emulator_image=$export_emulator_image"
            echo "build_assistant_apk=$build_assistant_apk"
            echo "run_smoke=$run_smoke"
            echo "skip_build=$skip_build"
          } >> "$GITHUB_OUTPUT"

      - name: Run GCP emulator lab
        shell: bash
        run: |
          set -euxo pipefail
          args=(
            --name "${{ steps.target.outputs.name }}"
            --repo-url "${{ steps.target.outputs.repo_url }}"
            --ref "${{ steps.target.outputs.ref }}"
            --project "${OPENPHONE_GCP_PROJECT}"
            --zone "${OPENPHONE_GCP_ZONE}"
            --machine-type "${{ steps.target.outputs.machine_type }}"
            --boot-disk-size "${{ steps.target.outputs.boot_disk_size }}"
            --boot-disk-type "${{ steps.target.outputs.boot_disk_type }}"
            --cache-mode "${{ steps.target.outputs.cache_mode }}"
            --arch "${{ steps.target.outputs.arch }}"
          )
          if [[ -n "${{ steps.target.outputs.cache_disk }}" ]]; then
            args+=(--cache-disk "${{ steps.target.outputs.cache_disk }}")
          fi
          if [[ -n "${{ steps.target.outputs.cache_source_snapshot }}" ]]; then
            args+=(--cache-source-snapshot "${{ steps.target.outputs.cache_source_snapshot }}")
          fi
          if [[ "${{ steps.target.outputs.keep_vm }}" == "true" ]]; then
            args+=(--keep-vm)
          fi
          if [[ "${{ steps.target.outputs.export_emulator_image }}" == "true" ]]; then
            args+=(--export-emulator-image)
          fi
          if [[ "${{ steps.target.outputs.build_assistant_apk }}" == "true" ]]; then
            args+=(--device tegu --build-assistant-apk)
          fi
          if [[ "${{ steps.target.outputs.run_smoke }}" != "true" ]]; then
            args+=(--skip-smoke)
          fi
          if [[ "${{ steps.target.outputs.skip_build }}" == "true" ]]; then
            args+=(--skip-build)
          fi
          IFS=',' read -r -a runtimes <<< "${{ steps.target.outputs.runtime }}"
          for runtime in "${runtimes[@]}"; do
            [[ -n "$runtime" ]] || continue
            args+=(--runtime "$runtime")
          done
          ./scripts/lab/gcp/run-smoke.sh "${args[@]}"

      - name: Summarize GCP emulator lab
        if: always()
        shell: bash
        run: |
          {
            echo "## GCP emulator lab"
            echo
            echo "- Cloud provider: \`GCP\`"
            echo "- Project: \`${OPENPHONE_GCP_PROJECT}\`"
            echo "- Zone: \`${OPENPHONE_GCP_ZONE}\`"
            echo "- VM: \`${{ steps.target.outputs.name }}\`"
            echo "- Source ref: \`${{ steps.target.outputs.ref }}\`"
            echo "- Source repo: \`${{ steps.target.outputs.repo_url }}\`"
            echo "- Runtime intents: \`${{ steps.target.outputs.runtime }}\`"
            echo "- Lane: \`${{ steps.target.outputs.lane }}\`"
            echo "- Emulator arch: \`${{ steps.target.outputs.arch }}\`"
            echo "- Machine type: \`${{ steps.target.outputs.machine_type }}\`"
            echo "- Cache mode: \`${{ steps.target.outputs.cache_mode }}\`"
            echo "- Cache disk: \`${{ steps.target.outputs.cache_disk || 'none' }}\`"
            echo "- Cache snapshot: \`${{ steps.target.outputs.cache_source_snapshot || 'none' }}\`"
            echo "- Export emulator image: \`${{ steps.target.outputs.export_emulator_image }}\`"
            echo "- Build assistant APK: \`${{ steps.target.outputs.build_assistant_apk }}\`"
            echo "- Run smoke: \`${{ steps.target.outputs.run_smoke }}\`"
            echo "- Skip build: \`${{ steps.target.outputs.skip_build }}\`"
            echo "- VM service account: \`disabled\`"
            echo "- VM OAuth scopes: \`disabled\`"
            echo "- Keep VM: \`${{ steps.target.outputs.keep_vm }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GCP lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openphone-gcp-lab
          path: .worktree/gcp-lab/
          if-no-files-found: warn

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.0.1"
        required: true
        default: "v0.0.1"
      device:
        description: "Device target"
        required: true
        default: "tegu"
        type: choice
        options:
          - tegu
      prerelease:
        description: "Mark as a GitHub prerelease"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      release_notes:
        description: "Release notes markdown file to publish"
        required: true
        default: "docs/releases/0.0.1.md"
      make_latest:
        description: "Whether this GitHub release becomes Latest"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
          - "legacy"
      dry_run:
        description: "Validate release gates without building OTA or publishing"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_emulator_smoke:
        description: "Require GCP lab emulator smoke before publishing"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      keep_gcp_lab_vm:
        description: "Leave GCP lab VM running for debugging"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  id-token: write

jobs:
  gcp-lab-smoke:
    name: Release GCP lab smoke
    if: ${{ inputs.run_emulator_smoke == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      OPENPHONE_GCP_PROJECT: ${{ vars.OPENPHONE_GCP_PROJECT || 'openphone-lab' }}
      OPENPHONE_GCP_REGION: ${{ vars.OPENPHONE_GCP_REGION || 'us-central1' }}
      OPENPHONE_GCP_ZONE: ${{ vars.OPENPHONE_GCP_ZONE || 'us-central1-a' }}
      OPENPHONE_GCP_MACHINE_TYPE: ${{ vars.OPENPHONE_GCP_MACHINE_TYPE || 'c3-standard-22' }}
      OPENPHONE_GCP_BOOT_DISK_SIZE: ${{ vars.OPENPHONE_GCP_BOOT_DISK_SIZE || '1000GB' }}
      OPENPHONE_GCP_BOOT_DISK_TYPE: ${{ vars.OPENPHONE_GCP_BOOT_DISK_TYPE || 'pd-ssd' }}
      OPENPHONE_GCP_CACHE_SOURCE_SNAPSHOT: ${{ vars.OPENPHONE_GCP_CACHE_SOURCE_SNAPSHOT || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate repository scaffold
        run: |
          set -euxo pipefail
          ./scripts/check.sh
          ./scripts/check-release-notes.sh "${{ inputs.version }}" "${{ inputs.release_notes }}"
          git diff --check
          test -f "${{ inputs.release_notes }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.OPENPHONE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.OPENPHONE_GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run release GCP lab smoke
        run: |
          set -euxo pipefail
          arch="${{ vars.OPENPHONE_EMULATOR_ARCH || 'x86_64' }}"
          args=(
            --name "openphone-lab-release-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}"
            --repo-url "https://github.com/secondly-com/OpenPhone.git"
            --ref "${GITHUB_SHA}"
            --project "${OPENPHONE_GCP_PROJECT}"
            --zone "${OPENPHONE_GCP_ZONE}"
            --machine-type "${OPENPHONE_GCP_MACHINE_TYPE}"
            --boot-disk-size "${OPENPHONE_GCP_BOOT_DISK_SIZE}"
            --boot-disk-type "${OPENPHONE_GCP_BOOT_DISK_TYPE}"
            --arch "$arch"
            --runtime local
          )
          if [[ -n "${OPENPHONE_GCP_CACHE_SOURCE_SNAPSHOT}" ]]; then
            args+=(--cache-mode snapshot --cache-source-snapshot "${OPENPHONE_GCP_CACHE_SOURCE_SNAPSHOT}")
          else
            args+=(--cache-mode scratch)
          fi
          if [[ "${{ inputs.keep_gcp_lab_vm }}" == "true" ]]; then
            args+=(--keep-vm)
          fi
          ./scripts/lab/gcp/run-smoke.sh "${args[@]}"

      - name: Upload GCP lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openphone-release-gcp-lab
          path: .worktree/gcp-lab/
          if-no-files-found: warn

  release-dry-run:
    name: Release dry run
    needs: gcp-lab-smoke
    if: ${{ always() && inputs.dry_run == 'true' && (inputs.run_emulator_smoke != 'true' || needs.gcp-lab-smoke.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate release metadata
        run: |
          set -euxo pipefail
          ./scripts/check.sh
          ./scripts/check-release-notes.sh "${{ inputs.version }}" "${{ inputs.release_notes }}"
          git diff --check
          test -f "${{ inputs.release_notes }}"

      - name: Summarize dry run
        run: |
          {
            echo "## Release dry run passed"
            echo
            echo "- Version: \`${{ inputs.version }}\`"
            echo "- Device: \`${{ inputs.device }}\`"
            echo "- Release notes: \`${{ inputs.release_notes }}\`"
            echo "- GCP lab smoke required: \`${{ inputs.run_emulator_smoke }}\`"
            echo "- OTA build skipped: \`true\`"
            echo "- GitHub Release publish skipped: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-device-preview:
    name: Build device preview
    needs: gcp-lab-smoke
    if: ${{ always() && inputs.dry_run != 'true' && (inputs.run_emulator_smoke != 'true' || needs.gcp-lab-smoke.result == 'success') }}
    runs-on: [self-hosted, openphone-build]
    timeout-minutes: 180
    env:
      OPENPHONE_ANDROID_DIR: ${{ vars.OPENPHONE_ANDROID_DIR || '.worktree/android' }}
      OPENPHONE_RELEASE: bp4a
      OPENPHONE_BUILD_GOAL: otapackage
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository
        run: |
          set -euxo pipefail
          ./scripts/check.sh
          ./scripts/check-release-notes.sh "${{ inputs.version }}" "${{ inputs.release_notes }}"
          git diff --check
          test -f "${{ inputs.release_notes }}"

      - name: Build OTA
        run: |
          set -euxo pipefail
          ./scripts/build.sh openphone_${{ inputs.device }}

      - name: Stage release artifacts
        id: stage
        run: |
          set -euxo pipefail
          staging=".worktree/releases/${{ inputs.version }}"
          product_dir="${OPENPHONE_ANDROID_DIR}/out/target/product/${{ inputs.device }}"
          src="${product_dir}/openphone_${{ inputs.device }}-ota.zip"
          dst="${staging}/openphone_${{ inputs.device }}-${{ inputs.version }}-ota.zip"

          mkdir -p "$staging"
          cp "$src" "$dst"
          scripts/generate-release-manifest.sh "${{ inputs.version }}" "$staging" "$staging"
          scripts/validate-release-artifacts.sh "$staging"

          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "ota_path=$dst" >> "$GITHUB_OUTPUT"
          echo "sha_path=${staging}/SHA256SUMS" >> "$GITHUB_OUTPUT"
          echo "artifacts_path=${staging}/ARTIFACTS.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body_path: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          make_latest: ${{ inputs.make_latest }}
          files: |
            ${{ steps.stage.outputs.ota_path }}
            ${{ steps.stage.outputs.sha_path }}
            ${{ steps.stage.outputs.artifacts_path }}
